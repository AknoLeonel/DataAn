version: 2
updates:
  - package-ecosystem: pip
    directory: /pipelines
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']
    ignore:
      # @astrojs/check aceita só TypeScript ^5 || ^6.
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
