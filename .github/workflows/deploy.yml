# Coleta os dados, gera o site e publica no GitHub Pages.
# Roda a cada push na main, todo dia às 06:17 (Brasília) e sob demanda.
name: Pipeline e deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/pyproject.toml

      - name: Instalar pipeline
        run: pip install ./pipelines

      # A versão publicada serve de fallback: se uma fonte cair, o último dado válido continua no ar.
      - name: Coletar, validar e publicar dados
        run: python -m dataan run --out web/public/data --seed-from "${{ steps.pages.outputs.base_url }}/data"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências do site
        working-directory: web
        run: npm ci

      - name: Gerar site
        working-directory: web
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
