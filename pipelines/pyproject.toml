[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dataan"
version = "0.1.0"
description = "Pipelines de dados públicos do DataAn: coleta, validação, análise e publicação em JSON/CSV."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.15"]

[project.scripts]
dataan = "dataan.cli:main"

[tool.setuptools.packages.find]
include = ["dataan*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501"]  # comprimento fica a cargo do `ruff format`
